<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SwiftSwap</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #000000;
            --card: #121214;
            --text: #ffffff;
            --text-secondary: #8e8e93;
            --accent: #ccff00; /* Салатовый */
            --accent-text: #000000;
            --border: #2c2c2e;
        }
        .light-theme {
            --bg: #f2f2f7; --card: #ffffff; --text: #000000; --text-secondary: #6e6e73; --accent: #a3e635; --accent-text: #000000; --border: #d1d1d6;
        }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: var(--bg); 
            color: var(--text); 
            margin: 0; 
            padding: 0; 
            padding-bottom: 90px; 
            min-height: 100vh; 
            overflow-x: hidden; 
        }

        /* --- АНИМАЦИЯ ЗАХОДА (FADE IN UP) --- */
        @keyframes enterApp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .screen.active > * {
            animation: enterApp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .screen.active > *:nth-child(1) { animation-delay: 0.05s; }
        .screen.active > *:nth-child(2) { animation-delay: 0.1s; }
        .screen.active > *:nth-child(3) { animation-delay: 0.15s; }

        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 20px; background: var(--bg); }
        .logo-icon { width: 32px; height: 32px; background: var(--accent); border-radius: 10px; display: flex; justify-content: center; align-items: center; color: var(--accent-text); font-weight: 900; font-size: 16px;}
        .logo-text { font-size: 20px; font-weight: 800; }
        .theme-toggle { background: var(--card); border: 1px solid var(--border); padding: 8px 14px; border-radius: 20px; font-size: 13px; cursor: pointer; color: var(--text); font-weight: 700;}

        .screen { display: none; padding: 0 20px; }
        .screen.active { display: block; }

        /* --- БАЛАНС --- */
        .balance-wrapper { background: var(--card); border-radius: 28px; padding: 30px 20px; margin-bottom: 20px; text-align: center; border: 1px solid var(--border); }
        .greeting { font-size: 16px; font-weight: 600; margin-bottom: 20px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .avatar { width: 32px; height: 32px; border-radius: 50%; background: #333; object-fit: cover;}
        .balance-label { font-size: 14px; color: var(--text-secondary); margin-bottom: 8px; font-weight: 600;}
        .balance-value { font-size: 52px; font-weight: 800; letter-spacing: -2px; margin-bottom: 4px; }
        .balance-fiat { font-size: 14px; color: var(--text-secondary); margin-bottom: 24px; font-weight: 500;}
        
        .action-grid { display: flex; gap: 10px; justify-content: center; }
        .btn-action { flex: 1; background: var(--input-bg); color: var(--text); padding: 16px; border-radius: 16px; border: 1px solid var(--border); font-weight: 700; font-size: 15px; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; transition: transform 0.1s; }
        .btn-action:active { transform: scale(0.95); }
        .btn-action.accent { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }

        /* --- БЛОК QR (Вместо синего) --- */
        .qr-block { 
            background: var(--card); 
            border-radius: 24px; 
            padding: 24px; 
            margin-bottom: 20px; 
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 15px;
        }
        .qr-icon-container {
            width: 60px;
            height: 60px;
            background: rgba(204, 255, 0, 0.1);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .qr-icon-container svg { width: 32px; height: 32px; stroke: var(--accent); }
        .qr-text { font-size: 16px; font-weight: 700; line-height: 1.3; }
        .btn-group { 
            background: var(--accent); 
            color: var(--accent-text); 
            border: none; 
            padding: 16px 24px; 
            border-radius: 16px; 
            font-weight: 800; 
            font-size: 15px; 
            cursor: pointer; 
            width: 100%;
            transition: transform 0.1s;
        }
        .btn-group:active { transform: scale(0.97); }

        /* --- ЭКРАН КАРТЫ (АНИМАЦИЯ) --- */
        .dev-btn-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 40px;
            min-height: 300px;
        }

        .dev-btn {
            width: 100%;
            padding: 18px;
            border-radius: 24px;
            background: #1c1c1e;
            border: 1px solid #333;
            color: white;
            font-size: 16px;
            font-weight: 600;
            text-align: center;
            animation: slideUpFade 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        /* Синяя кнопка как на скрине (для карт) */
        .dev-btn.blue {
            background: linear-gradient(180deg, #5c7cff 0%, #2b54ff 100%);
            border: 1px solid #4a6eff;
            box-shadow: 0 4px 15px rgba(43, 84, 255, 0.4);
        }

        @keyframes slideUpFade {
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- НИЖНЕЕ МЕНЮ --- */
        .bottom-nav { 
            position: fixed; bottom: 0; left: 0; right: 0; 
            background: var(--card); 
            display: flex; justify-content: space-around; align-items: flex-end; 
            padding: 10px 0 20px 0; 
            border-top: 1px solid var(--border); 
            border-radius: 30px 30px 0 0; 
            z-index: 100; 
        }
        
        .nav-item { 
            display: flex; flex-direction: column; align-items: center; gap: 4px; 
            color: var(--text-secondary); font-size: 11px; font-weight: 700; 
            cursor: pointer; width: 20%; position: relative;
            transition: color 0.3s;
        }
        
        .nav-icon-wrap { 
            width: 48px; height: 48px; 
            border-radius: 50%; 
            display: flex; justify-content: center; align-items: center; 
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        .nav-icon-wrap svg { width: 24px; height: 24px; fill: var(--text-secondary); transition: fill 0.3s; }

        .nav-item.active:not(.nav-item-exchange) .nav-icon-wrap {
            background: rgba(204, 255, 0, 0.15);
        }
        .nav-item.active:not(.nav-item-exchange) .nav-icon-wrap svg {
            fill: var(--accent);
        }
        .nav-item.active:not(.nav-item-exchange) {
            color: var(--accent);
        }

        /* Кнопка ОБМЕН */
        .nav-item-exchange {
            transform: translateY(-15px); 
        }
        .nav-item-exchange .nav-icon-wrap {
            width: 64px; height: 64px;
            background: var(--accent);
            box-shadow: 0 4px 15px rgba(204, 255, 0, 0.3);
            border: 4px solid var(--card);
        }
        .nav-item-exchange .nav-icon-wrap svg {
            width: 28px; height: 28px;
            fill: var(--accent-text);
        }
        .nav-item-exchange .nav-label {
            color: var(--text);
            margin-top: 4px;
        }

        .nav-icon-wrap:active { transform: scale(1.3); }
        .nav-item.active .nav-icon-wrap:active { background: var(--accent); }
        .nav-item.active .nav-icon-wrap:active svg { fill: var(--accent-text); }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="logo-container" style="display:flex; align-items:center; gap:8px;">
            <div class="logo-icon">S</div>
            <div class="logo-text">SwiftSwap</div>
        </div>
        <button class="theme-toggle" onclick="toggleTheme()">Тема</button>
    </div>

    <!-- ЭКРАН 1: ГЛАВНАЯ -->
    <div id="screen-home" class="screen active">
        <div class="balance-wrapper">
            <div class="greeting"><img src="https://ui-avatars.com/api/?name=U&background=random" class="avatar" id="user-avatar">Привет, <span id="user-name">Пользователь</span>!</div>
            <div class="balance-label">Баланс кошелька</div>
            <div class="balance-value">$0.00</div>
            <div class="balance-fiat">1$ = 93.09 ₽</div>
            <div class="action-grid">
                <button class="btn-action accent" onclick="alert('В разработке')">Пополнить ↘</button>
                <button class="btn-action" onclick="alert('В разработке')">Вывести ↗</button>
            </div>
        </div>

        <!-- Блок с иконкой QR и кнопкой группы -->
        <div class="qr-block">
            <div class="qr-icon-container">
                <!-- Иконка сканера/QR-кода -->
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 7V5a2 2 0 0 1 2-2h2"></path>
                    <path d="M17 3h2a2 2 0 0 1 2 2v2"></path>
                    <path d="M21 17v2a2 2 0 0 1-2 2h-2"></path>
                    <path d="M7 21H5a2 2 0 0 1-2-2v-2"></path>
                    <rect x="7" y="7" width="10" height="10" rx="1"></rect>
                </svg>
            </div>
            <div class="qr-text">Оплачивайте покупки криптой по QR-коду</div>
            <button class="btn-group" onclick="alert('Ссылка на группу появится позже')">Вступить в нашу группу</button>
        </div>
    </div>

    <!-- ЭКРАН 2: ЗАЯВКИ -->
    <div id="screen-orders" class="screen">
        <h2 style="margin-top: 10px; font-size: 24px; font-weight: 800;">Мои заявки</h2>
        <div style="text-align: center; color: var(--text-secondary); margin-top: 50px;">
            У вас пока нет заявок.
        </div>
    </div>

    <!-- ЭКРАН 3: ОБМЕН -->
    <div id="screen-exchange" class="screen">
        <h2 style="margin-top: 10px; font-size: 24px; font-weight: 800;">Обмен USDT</h2>
        <!-- Тут будет ваш обменник -->
    </div>

    <!-- ЭКРАН 4: КАРТА -->
    <div id="screen-card" class="screen">
        <h2 style="margin-top: 10px; font-size: 24px; font-weight: 800;">Выбор карты</h2>
        
        <div class="dev-btn-container" id="dev-container">
            <!-- Кнопки будут появляться тут -->
        </div>
        
        <button onclick="addDevButton()" style="width: 100%; margin-top: 20px; padding: 15px; background: transparent; border: 1px dashed var(--border); border-radius: 20px; color: var(--text-secondary); cursor: pointer;">
            Нажмите сюда, чтобы добавить кнопку (Тест)
        </button>
    </div>

    <!-- ЭКРАН 5: УСЛУГИ -->
    <div id="screen-services" class="screen">
        <h2 style="margin-top: 10px; font-size: 24px; font-weight: 800;">Услуги</h2>
        <div style="text-align: center; color: var(--text-secondary); margin-top: 50px;">
            В разработке.
        </div>
    </div>

    <!-- НИЖНЕЕ МЕНЮ -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchScreen('home', this)">
            <div class="nav-icon-wrap"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg></div>
            <span class="nav-label">Кошелек</span>
        </div>
        <div class="nav-item" onclick="switchScreen('orders', this)">
            <div class="nav-icon-wrap"><svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg></div>
            <span class="nav-label">Заявки</span>
        </div>
        <div class="nav-item nav-item-exchange" onclick="switchScreen('exchange', this)">
            <div class="nav-icon-wrap"><svg viewBox="0 0 24 24"><path d="M6.99 11L3 15l3.99 4v-3H14v-2H6.99v-3zM21 9l-3.99-4v3H10v2h7.01v3L21 9z"/></svg></div>
            <span class="nav-label">Обмен</span>
        </div>
        <div class="nav-item" onclick="switchScreen('card', this)">
            <div class="nav-icon-wrap"><svg viewBox="0 0 24 24"><path d="M20 4H4c-1.11 0-1.99.89-1.99 2L2 18c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V6c0-1.11-.89-2-2-2zm0 14H4v-6h16v6zm0-10H4V6h16v2z"/></svg></div>
            <span class="nav-label">Карта</span>
        </div>
        <div class="nav-item" onclick="switchScreen('services', this)">
            <div class="nav-icon-wrap"><svg viewBox="0 0 24 24"><path d="M4 8h4V4H4v4zm6 12h4v-4h-4v4zm-6 0h4v-4H4v4zm0-6h4v-4H4v4zm6 0h4v-4h-4v4zm6-10v4h4V4h-4zm-6 4h4V4h-4v4zm6 6h4v-4h-4v4zm0 6h4v-4h-4v4z"/></svg></div>
            <span class="nav-label">Услуги</span>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        if (window.Telegram) tg.expand(); 

        // Тема
        function setTheme(isDark) {
            if (isDark) { document.body.classList.remove('light-theme'); if(window.Telegram) tg.setHeaderColor('#000000'); } 
            else { document.body.classList.add('light-theme'); if(window.Telegram) tg.setHeaderColor('#ffffff'); }
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }
        function toggleTheme() { setTheme(!document.body.classList.contains('light-theme')); }
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme) setTheme(savedTheme === 'dark');
        else if (window.Telegram && tg.colorScheme) setTheme(tg.colorScheme === 'dark');
        else setTheme(window.matchMedia('(prefers-color-scheme: dark)').matches);

        // Юзер
        if (window.Telegram && tg.initDataUnsafe?.user) {
            const user = tg.initDataUnsafe.user;
            document.getElementById('user-name').innerText = user.first_name;
            if (user.photo_url) document.getElementById('user-avatar').src = user.photo_url;
        }

        // Навигация
        function switchScreen(screenName, el) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(`screen-${screenName}`).classList.add('active');
            
            if (el) el.classList.add('active');
            window.scrollTo(0,0);
        }

        // Тестовая логика добавления кнопок на экране Карты
        let btnCount = 0;
        function addDevButton() {
            btnCount++;
            const container = document.getElementById('dev-container');
            const btn = document.createElement('div');
            btn.className = 'dev-btn';
            
            if (btnCount >= 3) {
                btn.classList.add('blue');
            }
            
            btn.innerText = 'В разработке';
            container.appendChild(btn);
        }
    </script>
</body>
</html>
